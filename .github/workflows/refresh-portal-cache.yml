name: Refresh portal cache

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-portal-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh static cache from the live portal API
        run: node tools/refresh-portal-cache.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- schedule-cache.json event-guide-cache.json; then
            echo "No change; skipping commit."
            exit 0
          fi
          git config user.name "portal-cache-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule-cache.json event-guide-cache.json
          git commit -m "Auto-refresh portal cache snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
